name: Build Legcord AppImage

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Triggers:
#   - workflow_dispatch: manual run from the Actions tab
#   - schedule: every 7 days at 07:00 UTC, to pick up new Legcord releases
# The 'check' job compares the upstream version with LATEST_VERSION and skips
# the build if they match (so we don't waste CI minutes rebuilding the same
# version every week).
on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 7 1/7 * *"

jobs:
  check:
    name: Check for new upstream version
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Compare upstream version with LATEST_VERSION
        id: check
        run: |
          set -eu
          # Query GitHub API for the latest Legcord release tag
          LATEST=$(curl -sL -H "User-Agent: legcord-appimage" \
            https://api.github.com/repos/Legcord/Legcord/releases/latest \
            | jq -r '.tag_name | ltrimstr("v")')

          # Read the last successfully built version from the repo
          LAST_BUILT=$(cat LATEST_VERSION 2>/dev/null | tr -d '[:space:]')

          echo "Latest upstream: $LATEST"
          echo "Last built:     $LAST_BUILT"

          if [ -z "$LATEST" ] || [ "$LATEST" = "null" ]; then
            echo "ERROR: could not fetch upstream version from GitHub API"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          # On schedule: skip if we already built this version
          # On manual dispatch: always build (user explicitly asked)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$LATEST" = "$LAST_BUILT" ]; then
            echo "Version $LATEST already built. Skipping scheduled build."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "New version detected (or manual trigger). Will build $LATEST."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "version=$LATEST" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build AppImage (x86_64)
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    container: ghcr.io/pkgforge-dev/archlinux:latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Arch Linux container
        uses: pkgforge-dev/anylinux-setup-action@v2

      - name: Build AppImage
        run: |
          chmod +x ./build.sh
          ./build.sh

      - name: Update LATEST_VERSION and commit
        run: |
          NEW_VERSION="${{ needs.check.outputs.version }}"
          echo "$NEW_VERSION" > LATEST_VERSION
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add LATEST_VERSION
          git commit -m "chore: bump LATEST_VERSION to $NEW_VERSION" || echo "No changes to commit"
          git push || echo "Push failed (likely no changes or branch protection)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppImage-x86_64
          path: |
            dist/*.AppImage
            dist/*.AppImage.zsync
            dist/*.AppImage.sha256
            dist/appinfo
          if-no-files-found: error
          retention-days: 30

  release:
    name: Release to GitHub
    if: ${{ github.ref_name == 'main' && needs.check.outputs.should_build == 'true' }}
    needs: [build]
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AppImage-x86_64
          merge-multiple: true

      - name: Release AppImage
        uses: pkgforge-dev/make-stable-appimage-release@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_name: "Legcord"
          release_body: |
            Legcord is a custom client designed to enhance your Discord experience while keeping everything lightweight.

            Built using [Anylinux-AppImages](https://github.com/pkgforge-dev/Anylinux-AppImages) — runs on any Linux distro (glibc, musl, NixOS).
          release_files: |
            *.AppImage
            *.AppImage.zsync
            *.AppImage.sha256
