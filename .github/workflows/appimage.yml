name: Build Legcord AppImage

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Triggers:
#   - workflow_dispatch: manual run from the Actions tab (always builds)
#   - schedule: every 7 days at 07:00 UTC, to pick up new Legcord releases
# The 'check' job queries the upstream Legcord API and our own Releases API.
# If the upstream version matches an existing Release tag in THIS repo AND the
# run is scheduled, the build is skipped (no CI minutes wasted). Manual runs
# always build, regardless of whether the version already exists.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 7 1/7 * *"

jobs:
  check:
    name: Check for new upstream version
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Check if version already released
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          # Get latest Legcord version from upstream
          LATEST=$(curl -sL -H "User-Agent: legcord-appimage" \
            https://api.github.com/repos/Legcord/Legcord/releases/latest \
            | jq -r '.tag_name | ltrimstr("v")')

          echo "Latest upstream: $LATEST"

          if [ -z "$LATEST" ] || [ "$LATEST" = "null" ]; then
            echo "ERROR: could not fetch upstream version from GitHub API"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          # Check if THIS repo already has a release tagged v$LATEST
          EXISTING=$(curl -sL \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "User-Agent: legcord-appimage" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/v$LATEST")

          if echo "$EXISTING" | jq -e '.id' > /dev/null 2>&1; then
            echo "Release v$LATEST already exists in this repo."
            if [ "${{ github.event_name }}" = "schedule" ]; then
              echo "Scheduled run, version already built. Skipping."
              echo "should_build=false" >> "$GITHUB_OUTPUT"
            else
              echo "Manual run, will rebuild anyway."
              echo "should_build=true" >> "$GITHUB_OUTPUT"
              echo "version=$LATEST" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "Release v$LATEST does not exist yet. Will build."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "version=$LATEST" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build AppImage (x86_64)
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    container: ghcr.io/pkgforge-dev/archlinux:latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Arch Linux container
        uses: pkgforge-dev/anylinux-setup-action@v2

      - name: Build AppImage
        run: |
          chmod +x ./build.sh
          ./build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppImage-x86_64
          path: |
            dist/*.AppImage
            dist/*.AppImage.zsync
            dist/*.AppImage.sha256
            dist/appinfo
          if-no-files-found: error
          retention-days: 30

  release:
    name: Release to GitHub
    if: ${{ github.ref_name == 'main' && needs.check.outputs.should_build == 'true' }}
    needs: [build]
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AppImage-x86_64
          merge-multiple: true

      - name: Release AppImage
        uses: pkgforge-dev/make-stable-appimage-release@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_name: "Legcord"
          release_body: |
            Legcord is a custom client designed to enhance your Discord experience while keeping everything lightweight.

            Built using [Anylinux-AppImages](https://github.com/pkgforge-dev/Anylinux-AppImages) — runs on any Linux distro (glibc, musl, NixOS).
          release_files: |
            *.AppImage
            *.AppImage.zsync
            *.AppImage.sha256
